name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public frontend only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          cp -R css js music _site/

          # Copy public site metadata, search-engine files, and the custom 404 page.
          # Keep this allowlist explicit: do not publish Worker, database, or private sticker files.
          for file in sitemap.xml robots.txt 404.html yandex_0c28c99d887767fd.html; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done

          # Fail the build if the sitemap or custom error page was accidentally omitted.
          test -s _site/sitemap.xml
          test -s _site/robots.txt
          test -s _site/404.html

          # Copy only approved public image assets when present.
          for asset in favicon.png santa-flight.png "i (1).jpeg" i-_1_.png; do
            if [ -f "$asset" ]; then cp "$asset" _site/; fi
          done

          # Do not publish the memes folder or any Worker/D1 files.
          if [ -d stickers/cats ]; then
            mkdir -p _site/stickers
            cp -R stickers/cats _site/stickers/cats
          fi

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
